env: staging
---
deployments:
  - component: database
    envSecretRef: database-envs
    image: postgres:18-alpine
    name: database
    runsOn: postgres
  - component: cache
    containerPort: 6379
    image: redis:8-alpine
    name: redis
    runsOn: redis
secrets:
  - data:
      sec1: sec1val
      sec2: sec2val
    listTargetTest: otherval
    listTraversal:
      - t4val
    name: database-envs
    runsOnList:
      - database
services:
  - list:
      - someval1
      - otherval
    list2:
      - t1: t1val
        t2: t2val
      - t3: t3val
        t4: t4val
    name: database-service
    port: 5432
    runsOn: database
    targetPort: 5432
  - name: redis-service
    port: 6379
    runsOn: redis
    targetPort: 6379
