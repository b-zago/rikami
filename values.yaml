env: staging
---
deployments:
  - component: server
    containerPort: 3000
    envSecretRefs:
      - database-envs
    envVars:
      - name: DB_HOST
        value: scorevault-database-service
      - name: REDIS
        value: scorevault-redis-service
    image: ghcr.io/b-zago/scorevault/webserver:latest
    imagePullSecret: ghcr-creds
    name: web-server
    runsOn: python
  - component: cache
    containerPort: 6379
    image: redis:8-alpine
    name: redis
    runsOn: redis
  - component: database
    envSecretRef: database-envs
    image: postgres:18-alpine
    name: database
    runsOn: postgres
routes:
  - host: scorevaultin.zagoapps.com
    name: web-server-route
    runs-on: web-server-service
secrets:
  - data:
      sec1: sec1val
      sec2: sec2val
    name: database-envs
    runsOnList:
      - database
services:
  - name: web-server-service
    port: 80
    runs-on: web-server
    targetPort: 3000
  - name: redis-service
    port: 6379
    runsOn: redis
    targetPort: 6379
  - name: database-service
    port: 5432
    runsOn: database
    targetPort: 5432
