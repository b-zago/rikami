deployments:
  - component: server
    containerPort: 3000
    envVars:
      DB_HOST: scorevault-database-service
      REDIS: scorevault-redis-service
    image: ghcr.io/b-zago/scorevault/webserver:latest
    imagePullSecret: ghcr-creds
    name: web-server
    runsOn: python
  - bindedMapValue: custom1val
    component: cache
    containerPort: 6379
    image: redis:8-alpine
    name: redis
    runsOn: redis
routes:
  - host: scorevaultin.zagoapps.com
    name: web-server-route
    runs-on: web-server-service
services:
  - name: web-server-service
    port: 80
    runs-on: web-server
    targetPort: 3000
  - custom:
      custom1: custom1val
      custom2: custom2val
    name: redis-service
    port: 6379
    runsOn: redis
    targetPort: 6379
